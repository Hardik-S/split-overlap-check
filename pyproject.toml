[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "split-overlap-check"
version = "0.1.0"
description = "Exact text overlap checks across JSONL data splits"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hardik-S"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
split-overlap-check = "split_overlap_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
